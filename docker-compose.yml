# 优达智慧课堂教学管理平台 一键部署（Phase 5）
# 用法：docker compose up -d --build
# 前端  http://localhost        （Nginx，反向代理 /api、/files 到后端）
# 后端  http://localhost:8080   （Swagger UI：http://localhost:8080/swagger-ui/index.html）
services:
  mysql:
    image: mysql:8.0
    container_name: youda-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: youda_classroom
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 空库首次启动时执行建表脚本（幂等 IF NOT EXISTS）
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: youda-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: youda-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 覆盖 application.yml 中的 localhost 连接，指向容器内服务
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/youda_classroom?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build: ./frontend
    container_name: youda-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
  redis-data:
  uploads-data:
