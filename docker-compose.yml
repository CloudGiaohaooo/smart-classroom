# 优达智慧课堂教学管理平台 一键部署（Phase 5，Phase 16 安全加固）
# 用法：docker compose up -d --build
# 前端  http://localhost        （Nginx，反向代理 /api、/files 到后端）
# 后端  http://localhost:8080   （Swagger UI：http://localhost:8080/swagger-ui/index.html）
#
# 安全说明（Phase 16 / P0-C）：
#  - MySQL / Redis 不再映射到宿主机端口，仅服务间内部网络可达；
#  - 数据库使用专用账号 youda（非 root），Redis 开启 requirepass；
#  - 各类凭据均可通过环境变量覆盖（MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD / REDIS_PASSWORD / JWT_SECRET）。
services:
  mysql:
    image: mysql:8.0
    container_name: youda-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: youda_classroom
      MYSQL_USER: youda
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-youda_pass_2026}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 空库首次启动时执行建表脚本（幂等 IF NOT EXISTS）
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: youda-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-youda_redis_2026}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-youda_redis_2026} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: youda-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 覆盖 application.yml 中的 localhost 连接，指向容器内服务；使用专用账号 + 密码
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/youda_classroom?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: youda
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-youda_pass_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-youda_redis_2026}
      JWT_SECRET: ${JWT_SECRET:-YouDaSmartClassroom2026SecretKey@CQUPT-cyberspace-security}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build: ./frontend
    container_name: youda-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
  redis-data:
  uploads-data:
