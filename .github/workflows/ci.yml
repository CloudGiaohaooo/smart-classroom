# CI 自动化（Phase 5 补充）：每次 push / PR 自动跑后端测试 + 前端构建
# 后端测试含纯 Mock 单测/MockMvc 与 Testcontainers 真实 MySQL 集成测试；
# GitHub Actions ubuntu-latest 自带 Docker，Testcontainers 会在 CI 真实起 MySQL 容器跑集成测试（本地无 Docker 时自动跳过）。
name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  backend:
    name: 后端测试（JUnit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译并运行单测
        working-directory: backend
        run: mvn -B test

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖并构建
        working-directory: frontend
        run: |
          npm ci
          npm run build
