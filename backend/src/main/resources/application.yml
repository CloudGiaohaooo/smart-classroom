server:
  port: 8080

spring:
  application:
    name: smart-classroom
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true：首次启动自动创建数据库 youda_classroom
    url: jdbc:mysql://localhost:3306/youda_classroom?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  sql:
    init:
      # 每次启动执行 schema.sql（表结构使用 IF NOT EXISTS，幂等，不会破坏已有数据）
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  data:
    redis:
      # Redis 缓存连接（Phase 2）：Redis 不可用时接口自动降级直查数据库，不会 500
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，答辩演示时便于观察多表查询与事务；生产可关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 配置（密钥长度需 >= 32 字节，HS256）
jwt:
  secret: YouDaSmartClassroom2026SecretKey@CQUPT-cyberspace-security
  expire-minutes: 720

# 文件上传目录与访问前缀
file:
  upload-dir: ./uploads
  access-prefix: /files

# 缓存配置（Phase 2：Redis 缓存三策略，全部外置可调，避免硬编码魔法值）
cache:
  course-list-ttl: 300   # 课程列表缓存基础 TTL（秒）
  stats-ttl: 60          # 看板聚合统计缓存基础 TTL（秒）
  null-value-ttl: 30     # 空值缓存 TTL（秒）——防缓存穿透
  lock-ttl: 5            # 互斥锁 TTL（秒）——防缓存击穿
  ttl-jitter: 60         # 随机 TTL 抖动上限（秒）——防缓存雪崩

# 智能批阅辅助配置（Phase 3 创新点 A：雷同检测 + 评语推荐，阈值可调）
similarity:
  threshold: 0.45              # 相似度阈值（余弦 0~1），高于此值才进入「相似提交」列表
  suspicious-threshold: 0.75   # 疑似雷同阈值，高于此值标记 flagged
  top-n: 10                    # 相似提交最多返回条数
  suggestion-limit: 3          # 推荐评语返回条数
