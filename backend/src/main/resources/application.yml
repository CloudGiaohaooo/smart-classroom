server:
  port: 8080

spring:
  application:
    name: smart-classroom
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true：首次启动自动创建数据库 youda_classroom
    url: jdbc:mysql://localhost:3306/youda_classroom?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库凭据支持环境变量注入（DB_USERNAME / DB_PASSWORD）：生产环境务必通过环境变量注入，切勿使用默认弱口令
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  sql:
    init:
      # 每次启动执行 schema.sql（表结构使用 IF NOT EXISTS，幂等，不会破坏已有数据）
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  data:
    redis:
      # Redis 缓存连接（Phase 2）：Redis 不可用时接口自动降级直查数据库，不会 500
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis 密码（Phase 16）：生产环境通过 REDIS_PASSWORD 注入；本地无密码时留空即可
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，答辩演示时便于观察多表查询与事务；生产可关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 配置（密钥长度需 >= 32 字节，HS256）
jwt:
  # 签名密钥支持环境变量 JWT_SECRET 注入：生产环境务必通过环境变量/密钥管理服务注入强随机密钥，切勿在源码中保留默认值
  secret: ${JWT_SECRET:YouDaSmartClassroom2026SecretKey@CQUPT-cyberspace-security}
  expire-minutes: 720

# 文件上传目录与访问前缀
file:
  upload-dir: ./uploads
  access-prefix: /files
  sign-url-ttl: 1800   # 下载签名 URL 有效期（秒）；/files/** 仅接受带有效签名且未过期的链接（Phase 20 鉴权下载）

# 课程资源秒传去重配置（创新点 C：MD5 秒传去重，外置可调，避免硬编码魔法值）
resource:
  dedup-enabled: true   # 是否启用 MD5 秒传去重：相同文件只落盘一次，后续复用
  # 上传文件扩展名白名单（逗号分隔，小写）：拒绝 html/svg/js 等可执行类型，防止上传文件被当作同源脚本形成存储型 XSS
  allowed-extensions: pdf,doc,docx,xls,xlsx,ppt,pptx,txt,md,zip,png,jpg,jpeg,gif

# 缓存配置（Phase 2：Redis 缓存三策略，全部外置可调，避免硬编码魔法值）
cache:
  course-list-ttl: 300   # 课程列表缓存基础 TTL（秒）
  stats-ttl: 60          # 看板聚合统计缓存基础 TTL（秒）
  null-value-ttl: 30     # 空值缓存 TTL（秒）——防缓存穿透
  lock-ttl: 5            # 互斥锁 TTL（秒）——防缓存击穿
  ttl-jitter: 60         # 随机 TTL 抖动上限（秒）——防缓存雪崩

# 权限编码本地缓存（Phase 19：JWT 过滤器权限缓存，减少每请求一次 DB 查询；纯内存零外部依赖）
permission-cache:
  ttl: 300   # 权限编码缓存 TTL（秒）；账号状态仍每请求复查，「禁用账号即时失效」不受缓存影响

# 智能批阅辅助配置（Phase 3 创新点 A：雷同检测 + 评语推荐，阈值可调）
similarity:
  threshold: 0.45              # 相似度阈值（余弦 0~1），高于此值才进入「相似提交」列表
  suspicious-threshold: 0.75   # 疑似雷同阈值，高于此值标记 flagged
  top-n: 10                    # 相似提交最多返回条数
  suggestion-limit: 3          # 推荐评语返回条数

# 学习预警配置（Phase 4 创新点 B：学习行为预警规则外置，阈值可调）
warning:
  login-inactive-days: 7   # 超过 N 天未登录 → 触发「长期未登录」预警
  no-submit-days: 7        # 超过 N 天未提交作业 → 触发「长期未提交作业」预警
  trend-days: 7            # 提交率趋势统计最近 N 天
  heat-limit: 10           # 资源访问热力 TopN 课程数
